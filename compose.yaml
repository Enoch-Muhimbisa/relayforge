services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayforge
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: ${RELAYFORGE_DB_PASSWORD:-local-development-only}
    volumes:
      - relayforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge -d relayforge"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RELAYFORGE_ADDR: ":8080"
      RELAYFORGE_DATABASE_URL: postgres://relayforge:${RELAYFORGE_DB_PASSWORD:-local-development-only}@postgres:5432/relayforge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  console:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - relayforge_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api
volumes:
  relayforge_postgres:
  relayforge_node_modules:

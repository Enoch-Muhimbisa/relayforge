services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RELAYFORGE_ADDR: ":8080"
    restart: unless-stopped
  console:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - relayforge_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api
volumes:
  relayforge_node_modules:

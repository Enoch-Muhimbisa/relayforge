name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relayforge_test
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RELAYFORGE_TEST_DATABASE_URL: postgres://relayforge:relayforge-test-password@localhost:5432/relayforge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go mod tidy
      - run: go test -race -cover ./...
      - run: go vet ./...
  web:
    name: TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
